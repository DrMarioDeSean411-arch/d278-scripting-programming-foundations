  .breakdown-pct{width:44px;text-align:right;font-weight:700;}
  .placeholder{color:var(--label-dark);font-size:14px;text-align:center;padding:24px;}

];

const QUESTIONS = {

c1: [
// --- Program vs. script distinction (4) ---
{sec:'c1',comp:'C1',topic:'Program vs script',diff:'found',type:'mc',
 stem:"Which best distinguishes a script from a compiled program in typical usage?",
 opts:["A script must be converted to machine code before it can ever run","A script is generally executed directly by an interpreter, often to automate a task, while a compiled program is translated into machine code before execution","A script cannot contain loops or conditionals","A compiled program is always shorter than a script"],
 ans:1,
 rationale:"<strong>B is correct.</strong> Scripts are typically run line-by-line by an interpreter and are often written to automate a task, while compiled programs are translated in full to machine code ahead of time.",
 misconception:"Students often think 'script' and 'program' are strictly interchangeable terms rather than describing different execution models."},

{sec:'c1',comp:'C1',topic:'Program vs script',diff:'found',type:'mc',
 stem:"A developer writes a short set of Python commands to rename all files in a folder. What is this an example of?",
 opts:["A compiler","A script","An assembler","A flowchart"],
 ans:1,
 rationale:"<strong>B is correct.</strong> A short set of commands written to automate a repetitive task and run through an interpreter is a script.",
 misconception:"Students sometimes assume anything written in Python must be a 'program' rather than recognizing task-automation code as a script."},

{sec:'c1',comp:'C1',topic:'Program vs script',diff:'inter',type:'mc',
 stem:"Which statement about the relationship between programs and scripts is accurate?",
 opts:["Every program is a script, but not every script is a program","Every script is a program, but not every program is necessarily written to automate a task the way a script is","Scripts and programs use entirely different variable types","Only scripts can produce output"],
 ans:1,
 rationale:"<strong>B is correct.</strong> A script is a type of program, generally interpreted and task-oriented, but the broader category of 'program' includes compiled software that is not a script.",
 misconception:"Students often treat the two terms as mutually exclusive categories rather than one being a subset of the other."},

{sec:'c1',comp:'C1',topic:'Program vs script',diff:'inter',type:'mc',
 stem:"A large accounting application with a graphical interface, installed and compiled ahead of time, is best described as:",
 opts:["A script","A pseudocode file","A compiled program","A flowchart"],
 ans:2,
 rationale:"<strong>C is correct.</strong> Large, installed, pre-translated software is described as a compiled program rather than a script, which is typically smaller and interpreted.",
 misconception:"Students sometimes label any executable file a 'script' regardless of how it was built or how large it is."},

// --- Compiled vs interpreted languages (4) ---
{sec:'c1',comp:'C1',topic:'Compiled vs interpreted',diff:'found',type:'mc',
 stem:"What happens to source code in a compiled language before the program can run?",
 opts:["It is translated entirely into machine code in advance by a compiler","It is executed one line at a time as it is read","It is converted directly into pseudocode","It is skipped and only comments are processed"],
 ans:0,
 rationale:"<strong>A is correct.</strong> Compiled languages translate the entire source file into machine code ahead of runtime, producing an executable.",
 misconception:"Students confuse compiling with interpreting, assuming both happen line-by-line at runtime."},

{sec:'c1',comp:'C1',topic:'Compiled vs interpreted',diff:'found',type:'mc',
 stem:"Which best describes how an interpreted language executes?",
 opts:["The whole file is translated into an executable before any code runs","Each line or statement is translated and executed in sequence as the program runs","It requires an assembler instead of any translator","It produces object code that is stored permanently on disk"],
 ans:1,
 rationale:"<strong>B is correct.</strong> An interpreter reads and executes source code statement by statement at runtime rather than producing a standalone executable ahead of time.",
 misconception:"Students sometimes think interpreted languages skip translation altogether, when in fact translation still happens — just incrementally at runtime."},

{sec:'c1',comp:'C1',topic:'Compiled vs interpreted',diff:'inter',type:'mc',
 stem:"Why might a compiled program often run faster than an equivalent interpreted script?",
 opts:["Compiled programs use fewer variables","The translation to machine code happens once, ahead of time, rather than repeatedly during execution","Interpreted languages cannot use loops","Compiled programs are always written in fewer lines"],
 ans:1,
 rationale:"<strong>B is correct.</strong> Because compilation happens once before execution, the CPU runs pre-translated machine code directly, avoiding the repeated translation overhead an interpreter incurs during execution.",
 misconception:"Students often attribute speed differences to code length or syntax rather than to when and how translation occurs."},

{sec:'c1',comp:'C1',topic:'Compiled vs interpreted',diff:'adv',type:'mc',
 stem:"A team needs a language where they can test a single changed line immediately without rebuilding the whole application. Which execution model best supports this workflow, and why?",
 opts:["Compiled, because compilers detect errors faster","Interpreted, because each statement can be run and observed individually without a separate build step","Compiled, because machine code is portable across operating systems","Interpreted, because interpreters do not report errors"],
 ans:1,
 rationale:"<strong>B is correct.</strong> Interpreted execution evaluates statements as encountered, so a single changed line can be tested immediately without recompiling the entire program.",
 misconception:"Students sometimes assume compiled languages are always the better choice without weighing the iterative-testing tradeoff interpreters offer."},

// --- Source/object/machine code (4) ---
{sec:'c1',comp:'C1',topic:'Source, object, machine code',diff:'found',type:'mc',
 stem:"The human-readable code a programmer types, before any translation, is called:",
 opts:["Machine code","Object code","Source code","Bytecode assembly"],
 ans:2,
 rationale:"<strong>C is correct.</strong> Source code is the original, human-readable code written by the programmer.",
 misconception:"Students sometimes use 'source code' and 'machine code' interchangeably."},

{sec:'c1',comp:'C1',topic:'Source, object, machine code',diff:'found',type:'mc',
 stem:"Which type of code consists of binary instructions the CPU can execute directly?",
 opts:["Source code","Pseudocode","Machine code","Flowchart notation"],
 ans:2,
 rationale:"<strong>C is correct.</strong> Machine code is the binary instruction set that a CPU executes directly, produced after translation from source code.",
 misconception:"Students sometimes think 'object code' and 'machine code' are always identical, when object code may still require linking before becoming a final executable."},

{sec:'c1',comp:'C1',topic:'Source, object, machine code',diff:'inter',type:'mc',
 stem:"An intermediate, partially-translated form of a program, produced by a compiler before final linking into an executable, is called:",
 opts:["Source code","Object code","Pseudocode","A flowchart"],
 ans:1,
 rationale:"<strong>B is correct.</strong> Object code is machine-oriented but not yet a complete, linked executable — it is the intermediate output of compilation.",
 misconception:"Students frequently skip the concept of object code entirely, assuming compilation goes directly from source code to a finished executable in a single indivisible step."},

{sec:'c1',comp:'C1',topic:'Source, object, machine code',diff:'inter',type:'mc',
 stem:"Put the following into the correct order of transformation for a typical compiled language: (1) machine code, (2) source code, (3) object code.",
 opts:["1, 2, 3","2, 3, 1","3, 2, 1","2, 1, 3"],
 ans:1,
 rationale:"<strong>B is correct.</strong> A programmer writes source code (2), the compiler produces object code (3), and linking produces the final machine code executable (1).",
 misconception:"Students often reverse the order, assuming machine code is produced before object code."},

// --- Assemblers/compilers/interpreters (4) ---
{sec:'c1',comp:'C1',topic:'Translators: assemblers/compilers/interpreters',diff:'found',type:'mc',
 stem:"Which translator converts assembly language into machine code?",
 opts:["Compiler","Interpreter","Assembler","Linker"],
 ans:2,
 rationale:"<strong>C is correct.</strong> An assembler is the translator specifically responsible for converting assembly language into machine code.",
 misconception:"Students often use 'compiler' as a catch-all term for any translator, including assemblers and interpreters."},

{sec:'c1',comp:'C1',topic:'Translators: assemblers/compilers/interpreters',diff:'found',type:'mc',
 stem:"Which of these is NOT a type of language translator?",
 opts:["Compiler","Interpreter","Assembler","Flowchart"],
 ans:3,
 rationale:"<strong>D is correct.</strong> A flowchart is a diagram used for planning logic, not a language translator; compilers, interpreters, and assemblers all translate code.",
 misconception:"Students sometimes think flowcharts are executed by the computer rather than being a design/planning tool."},

{sec:'c1',comp:'C1',topic:'Translators: assemblers/compilers/interpreters',diff:'inter',type:'mc',
 stem:"A high-level language such as Python primarily relies on which type of translator to run?",
 opts:["An assembler only","A compiler that produces a standalone .exe every time it runs","An interpreter, which executes statements directly, often without producing a separate machine-code file","A linker only"],
 ans:2,
 rationale:"<strong>C is correct.</strong> Python code is typically executed by an interpreter, which reads and runs source statements without necessarily producing a permanent standalone executable.",
 misconception:"Students sometimes assume all high-level languages must be compiled into a .exe file to run at all."},

{sec:'c1',comp:'C1',topic:'Translators: assemblers/compilers/interpreters',diff:'adv',type:'mc',
 stem:"A junior developer says, 'The compiler is running my program right now.' What is imprecise about this statement?",
 opts:["Compilers cannot process any language","A compiler translates code before execution; it is not the mechanism that executes the running program","Compilers only work on assembly language","There is no imprecision — the statement is accurate"],
 ans:1,
 rationale:"<strong>B is correct.</strong> A compiler's job is translation, which happens before execution. Once translated, the resulting machine code is executed by the CPU/operating system, not by the compiler itself.",
 misconception:"Students often conflate the translation step with the execution step, treating the compiler as though it stays active while the program runs."},

// --- IDEs and development environments (4) ---
{sec:'c1',comp:'C1',topic:'IDEs',diff:'found',type:'mc',
 stem:"What does IDE stand for in the context of software development?",
 opts:["Interpreted Development Executable","Integrated Development Environment","Internal Data Encoder","Isolated Debugging Engine"],
 ans:1,
 rationale:"<strong>B is correct.</strong> IDE stands for Integrated Development Environment, a software application that bundles tools like an editor, debugger, and often a compiler or interpreter.",
 misconception:"Students sometimes confuse IDE with a single tool like a text editor, missing that it integrates multiple tools."},

{sec:'c1',comp:'C1',topic:'IDEs',diff:'found',type:'mc',
 stem:"Which of the following is a benefit commonly provided by an IDE?",
 opts:["It removes the need to ever test a program","Syntax highlighting, integrated debugging, and code completion in one environment","It guarantees the program has no logic errors","It replaces the need for pseudocode entirely"],
 ans:1,
 rationale:"<strong>B is correct.</strong> IDEs commonly bundle features like syntax highlighting, debugging tools, and code completion to streamline development.",
 misconception:"Students sometimes think an IDE guarantees correctness rather than simply supporting the development process."},

{sec:'c1',comp:'C1',topic:'IDEs',diff:'inter',type:'mc',
 stem:"A student writes code in a plain text editor with no debugging tools, syntax highlighting, or build integration. What is missing compared to using an IDE?",
 opts:["Nothing — plain text editors and IDEs are functionally identical","The integrated tooling that supports writing, testing, and debugging code within one environment","The ability to save the file","The ability to use variables"],
 ans:1,
 rationale:"<strong>B is correct.</strong> The defining feature of an IDE is the integration of multiple development tools in one environment; a plain text editor lacks that integration.",
 misconception:"Students sometimes assume any code editor qualifies as an IDE regardless of whether it integrates debugging or build tools."},

{sec:'c1',comp:'C1',topic:'IDEs',diff:'inter',type:'mc',
 stem:"Which scenario best justifies choosing an IDE over a plain text editor for a new scripting project?",
 opts:["The project has zero lines of code","The developer wants built-in debugging and error highlighting while writing a multi-file project","The script will only ever be run once and deleted","The developer does not want any tooling support"],
 ans:1,
 rationale:"<strong>B is correct.</strong> IDEs are most valuable when a project benefits from integrated debugging, error detection, and organization across multiple files.",
 misconception:"Students sometimes think IDEs are only useful for large compiled applications, not scripting projects."},

// --- Pseudocode syntax and conventions (5) ---
{sec:'c1',comp:'C1',topic:'Pseudocode conventions',diff:'found',type:'mc',
 stem:"What is the primary purpose of pseudocode?",
 opts:["To execute directly on a computer without translation","To describe an algorithm's logic in plain, structured language before writing actual code","To replace the need for testing","To serve as the final compiled output of a program"],
 ans:1,
 rationale:"<strong>B is correct.</strong> Pseudocode is a structured, language-independent way to describe an algorithm's logic before implementation in a real programming language.",
 misconception:"Students sometimes think pseudocode must follow a specific language's exact syntax rules."},

{sec:'c1',comp:'C1',topic:'Pseudocode conventions',diff:'found',type:'mc',
 stem:"Why is pseudocode useful when planning a program before writing real code?",
 opts:["It lets a developer focus on logic and structure without worrying about a specific language's syntax","It automatically becomes the final program","It eliminates the need for variables","It can only be understood by compilers"],
 ans:0,
 rationale:"<strong>A is correct.</strong> Pseudocode allows the developer to plan control flow and logic without getting bogged down in language-specific syntax rules.",
 misconception:"Students sometimes treat pseudocode as throwaway busywork rather than a genuine planning tool that reduces logic errors later."},

{sec:'c1',comp:'C1',topic:'Pseudocode conventions',diff:'inter',type:'mc',
 stem:"Which of the following is written in an appropriate pseudocode style for a loop that sums input values until a sentinel of 0 is entered?",
 opts:["sum = 0; while (val != 0) { sum += val; val = input(); }","sum = 0\nval = Get next input\nwhile val != 0\n   sum = sum + val\n   val = Get next input","for(int i=0;i<10;i++){sum+=val;}","SUM.EQUALS(0).THEN.LOOP.UNTIL.ZERO"],
 ans:1,
 rationale:"<strong>B is correct.</strong> This option uses plain structured language and indentation to express the loop's logic without binding to a specific programming language's exact syntax, which is the hallmark of good pseudocode.",
 misconception:"Students often default to writing actual language syntax (like C-style braces and semicolons) instead of plain structured pseudocode."},

{sec:'c1',comp:'C1',topic:'Pseudocode conventions',diff:'inter',type:'mc',
 stem:"A pseudocode document uses consistent indentation to show which statements belong inside a loop or conditional. What is the primary reason this convention matters?",
 opts:["Indentation is required for the pseudocode to compile","Indentation visually communicates the scope and structure of the logic to a human reader","Indentation determines variable data types","Indentation replaces the need for a stem in the question"],
 ans:1,
 rationale:"<strong>B is correct.</strong> Because pseudocode is not executed by a machine, indentation exists purely to communicate structure and scope clearly to human readers.",
 misconception:"Students sometimes think indentation in pseudocode has functional significance the way it does in a language like Python, when its role is purely for readability."},

{sec:'c1',comp:'C1',topic:'Pseudocode conventions',diff:'adv',type:'mc',
 stem:"A developer is translating pseudocode into Python but the pseudocode line reads: 'if age is at least 18 and has valid ID, allow entry.' Which Python-style conditional most faithfully preserves the intended logic?",
 opts:["if age >= 18 or has_valid_id:", "if age >= 18 and has_valid_id:", "if age > 18 and has_valid_id:", "if age >= 18: has_valid_id"],
 ans:1,
 rationale:"<strong>B is correct.</strong> 'At least 18' translates to >= 18, and the pseudocode requires both conditions to be true, which maps to a logical AND, not OR.",
 misconception:"Students sometimes swap AND/OR when translating natural-language conjunctions, or mistranslate 'at least' as a strict greater-than."},

// --- Flowchart symbols (5) ---
{sec:'c1',comp:'C1',topic:'Flowchart symbols',diff:'found',type:'mc',
 stem:"In standard flowchart notation, which shape represents a decision point?",
 opts:["Rectangle","Oval","Diamond","Parallelogram"],
 ans:2,
 rationale:"<strong>C is correct.</strong> A diamond shape represents a decision point, where the flow branches based on a condition.",
 misconception:"Students sometimes confuse the diamond (decision) with the rectangle (process step)."},

{sec:'c1',comp:'C1',topic:'Flowchart symbols',diff:'found',type:'mc',
 stem:"Which flowchart shape marks the start or stop point of a program's logic?",
 opts:["Diamond","Oval / rounded shape","Rectangle","Parallelogram"],
 ans:1,
 rationale:"<strong>B is correct.</strong> An oval or rounded shape is the standard symbol for the start and stop points of a flowchart.",
 misconception:"Students sometimes use a rectangle for start/stop, confusing it with a process step."},

{sec:'c1',comp:'C1',topic:'Flowchart symbols',diff:'inter',type:'mc',
 stem:"A flowchart shows a parallelogram symbol containing the text 'Enter your age.' What does this symbol most likely represent?",
 opts:["A processing step, like an arithmetic calculation","An input or output operation","A decision point","The end of the program"],
 ans:1,
 rationale:"<strong>B is correct.</strong> A parallelogram is the standard symbol for input/output operations, such as prompting for and receiving user input.",
 misconception:"Students sometimes assume every shape besides the diamond and oval represents a generic processing step, missing that parallelograms specifically denote I/O."},

{sec:'c1',comp:'C1',topic:'Flowchart symbols',diff:'inter',type:'mc',
 stem:"In a flowchart, a rectangle labeled 'total = total + price' would represent which type of step?",
 opts:["A decision","An input/output operation","A processing/assignment step","The start of the program"],
 ans:2,
 rationale:"<strong>C is correct.</strong> A rectangle represents a processing step, such as an assignment or calculation, which this arithmetic update to `total` is.",
 misconception:"Students sometimes label any rectangle in a flowchart as 'the program' generally rather than recognizing it as a specific processing step."},

{sec:'c1',comp:'C1',topic:'Flowchart symbols',diff:'adv',type:'mc',
 stem:"A flowchart segment shows: Oval (Start) → Parallelogram (Get age) → Diamond (age >= 18?) → two paths leading to two Rectangles ('Set status = Adult' / 'Set status = Minor') → both paths merge into an Oval (Stop). What logic does this flowchart represent?",
 opts:["A loop that repeats until age is 18","A conditional that assigns a status based on whether age is at least 18, then ends","An error-handling routine with no decision logic","A flowchart with no valid start or stop points"],
 ans:1,
 rationale:"<strong>B is correct.</strong> The diamond creates a branch based on the age comparison, each branch assigns a different status in a rectangle, and both paths converge before reaching the stop oval — a straightforward if/else structure, not a loop.",
 misconception:"Students sometimes assume any diamond in a flowchart implies a loop, rather than recognizing a simple one-time branch that merges back together."},

// --- Requirements analysis (4) ---
{sec:'c1',comp:'C1',topic:'Requirements analysis',diff:'found',type:'mc',
 stem:"What is the primary purpose of requirements analysis before writing a program?",

 ans:1,

{sec:'c1',comp:'C1',topic:'Requirements analysis',diff:'inter',type:'mc',

{sec:'c1',comp:'C1',topic:'Requirements analysis',diff:'inter',type:'mc',

 rationale:"<strong>B is correct.</strong> Selection sort repeatedly selects the smallest (or largest) remaining unsorted element and places it at the boundary of the sorted portion.",
 misconception:"Students often confuse selection sort's 'find the minimum' strategy with bubble sort's adjacent-swap strategy."},

{sec:'c3',comp:'C3',topic:'Selection sort',diff:'found',type:'mc',

{sec:'c3',comp:'C3',topic:'Bubble sort',diff:'adv',type:'mc',

 misconception:"Students often assume a single bubble sort pass fully sorts the list, when in fact only the largest element is guaranteed to reach its correct end position after one pass."},

{sec:'c3',comp:'C3',topic:'Bubble sort',diff:'found',type:'mc',
 stem:"What is the basic strategy of bubble sort?",

 ans:0,
 rationale:"<strong>A is correct.</strong> Bubble sort compares adjacent pairs and swaps them if out of order, repeating passes through the list until it is fully sorted.",
 misconception:"Students sometimes confuse bubble sort's adjacent-swap approach with selection sort's minimum-finding approach."},

{sec:'c3',comp:'C3',topic:'Bubble sort',diff:'found',type:'mc',
 stem:"In bubble sort (ascending order), what happens to the largest element in the list after the first complete pass?",

{sec:'c3',comp:'C3',topic:'Bubble sort',diff:'inter',type:'mc',
 stem:"A list of 6 elements is already sorted, but a naive bubble sort implementation with no early-exit check still runs its full number of passes. What is the main inefficiency this illustrates?",

 rationale:"<strong>B is correct.</strong> Without a check to stop early when a pass makes no swaps, a naive bubble sort keeps running its full number of passes even on data that is already sorted, wasting comparisons.",

// --- Time complexity (5) ---

{sec:'c3',comp:'C3',topic:'Time complexity',diff:'found',type:'mc',

 opts:["O(1)", "O(n)", "O(log n)", "O(n^2)"],

 rationale:"<strong>B is correct.</strong> Linear search's worst case grows directly in proportion to the number of elements n, which is O(n).",

{sec:'c3',comp:'C3',topic:'Time complexity',diff:'inter',type:'mc',

 opts:["O(n)", "O(log n)", "O(n^2)", "O(1)"],

 rationale:"<strong>B is correct.</strong> Because binary search halves the remaining elements each step, its worst-case runtime grows logarithmically with input size: O(log n).",

{sec:'c3',comp:'C3',topic:'Time complexity',diff:'inter',type:'mc',

 opts:["O(n)", "O(log n)", "O(n^2)", "O(1)"],

 rationale:"<strong>C is correct.</strong> Nested loops that each run proportional to n produce n * n total iterations, which is O(n^2).",

{sec:'c3',comp:'C3',topic:'Time complexity',diff:'adv',type:'mc',
 stem:"An algorithm's runtime is measured as it processes lists of increasing size: 10 elements takes roughly 1 unit of time, 100 elements takes roughly 2 units, and 1000 elements takes roughly 3 units. Which time complexity does this growth pattern most closely resemble?",

 rationale:"<strong>C is correct.</strong> Runtime increasing by a roughly constant amount each time the input size increases by a factor of 10 is the hallmark of logarithmic growth, O(log n).",
 misconception:"Students sometimes assume any growth at all implies O(n), missing that the specific pattern here (small, steady increases for large multiplicative jumps in input) is distinctly logarithmic."},

{sec:'c3',comp:'C3',topic:'Recursion',diff:'found',type:'mc',

 ans:1,
 rationale:"<strong>B is correct.</strong> The base case is the stopping condition that allows a recursive function to return a value directly instead of making another recursive call.",
 misconception:"Students sometimes think any function statement can serve as a base case rather than recognizing it must be the specific condition that halts recursion."},

{sec:'c3',comp:'C3',topic:'Recursion',diff:'found',type:'mc',

 misconception:"Students sometimes think the recursive case must fully solve the problem in one call rather than reducing it and delegating to another call."},

{sec:'c3',comp:'C3',topic:'Recursion',diff:'inter',type:'mc',
 stem:"Trace the code below. What is Factorial(3)?",
 code:true,

{sec:'c3',comp:'C3',topic:'Recursion',diff:'inter',type:'mc',

 misconception:"Students sometimes assume the program will simply run a long time rather than actually erroring out due to the finite call stack."},

{sec:'c3',comp:'C3',topic:'Algorithm correctness and counterexamples',diff:'found',type:'mc',
 stem:"What does it mean for an algorithm to be 'correct'?",

 rationale:"<strong>B is correct.</strong> Correctness means the algorithm reliably produces the right output for every valid input, not just that it compiles or runs quickly.",

{sec:'c3',comp:'C3',topic:'Algorithm correctness and counterexamples',diff:'inter',type:'mc',
 stem:"A student claims an algorithm 'always finds the maximum value in a list' but it fails on a list containing negative numbers. What does this failing case represent?",

 rationale:"<strong>B is correct.</strong> A single input for which the algorithm produces a wrong result is a counterexample, and a valid counterexample is sufficient to disprove a claim of full correctness.",

{sec:'c3',comp:'C3',topic:'Algorithm correctness and counterexamples',diff:'adv',type:'mc',
 stem:"An algorithm is claimed to correctly sort any list of integers, and it passes 50 test cases. Does this prove the algorithm is correct for all possible inputs?",

 ans:1,
 rationale:"<strong>B is correct.</strong> Passing test cases builds confidence but is not a mathematical guarantee; correctness for all inputs requires either a formal proof or an exhaustive check, and any single counterexample would disprove it.",

{sec:'sim',comp:'mixed',topic:'Sentinel loop in a real input scenario',diff:'adv',type:'sim',
 scenario:"A data analyst is writing a script that reads temperature readings from a sensor log, one at a time, and averages them. The sensor outputs a special value of -999 to signal that no more readings are available. The analyst's first draft of the loop does not read a new value at the end of the loop body.",
 stem:"What is the most likely consequence of this omission?",
 code:true,
 stemCode:"integer total\ninteger count\ninteger val\ntotal = 0\ncount = 0\nval = Get next input\nwhile val != -999\n   total = total + val\n   count = count + 1\n   // missing: val = Get next input",
 opts:["The script will run correctly with no issues", "The script will enter an infinite loop, because val is never updated inside the loop body, so the sentinel condition can never be reached", "The script will immediately crash on the first line", "The script will only read exactly one value and stop, with no error"],
 ans:1,
 rationale:"<strong>B is correct.</strong> Because val is never re-read inside the loop body, its value never changes, so the while condition val != -999 remains true forever, producing an infinite loop.",
 misconception:"Students sometimes focus on the priming read before the loop while overlooking that a matching read is also required at the end of the loop body to advance the sentinel check."},

{sec:'sim',comp:'mixed',topic:'Recursion depth in a real application',diff:'adv',type:'sim',
 scenario:"A developer writes a recursive function to calculate the factorial of a user-provided number for a scientific calculator app. During testing, entering a very large number (like 50,000) causes the app to crash with a stack overflow error, while small numbers work fine.",
 stem:"What does this behavior most likely indicate about the recursive function?",
 opts:["The function has no bugs and large inputs are simply unsupported by all computers", "The function's base case and recursive logic are likely correct for small inputs, but very deep recursion for large inputs exhausts the call stack's limited memory", "The function is using an infinite loop instead of recursion", "Stack overflow errors only occur with syntax errors"],
 ans:1,
 rationale:"<strong>B is correct.</strong> Because small inputs work correctly, the recursive logic and base case are likely sound; the crash on very large inputs is a classic symptom of exceeding the call stack's finite memory through excessively deep recursion, not a logic bug in the recursive steps themselves.",
 misconception:"Students often assume a crash always means the algorithm's logic is wrong, rather than recognizing that recursion depth itself is a resource with real limits, separate from whether the logic is correct."},

{sec:'sim',comp:'mixed',topic:'Choosing between selection and bubble sort in context',diff:'adv',type:'sim',
 scenario:"A student is comparing selection sort and bubble sort for a class project sorting a small list of 8 exam scores. Their instructor notes that for very small lists, the practical performance difference between the two algorithms is often negligible, and code clarity matters more.",
 stem:"Given the instructor's guidance, what is the most reasonable takeaway for the student's project?",
 opts:["Always choose the algorithm with the better theoretical Big O complexity, regardless of context", "For a very small, one-time list like this, either algorithm is a reasonable choice, and factors like code clarity may matter more than raw performance at this scale", "Selection sort should never be used under any circumstances", "Bubble sort is always faster than selection sort on any input"],
 ans:1,
 rationale:"<strong>B is correct.</strong> Both selection sort and bubble sort have similar O(n^2) worst-case complexity, and on a list as small as 8 elements the practical performance difference is negligible, making other factors like clarity reasonable tiebreakers, exactly as the instructor suggested.",
 misconception:"Students sometimes treat Big O complexity as the only factor that ever matters, without recognizing that at small input sizes, constant-factor differences and code readability can reasonably outweigh asymptotic complexity."},

{sec:'sim',comp:'mixed',topic:'Requirements gap causing a defect',diff:'adv',type:'sim',
 scenario:"A team builds a shipping cost calculator based on a requirements document that only specifies 'domestic' shipping rates. After launch, customers entering international addresses receive an incorrect $0 shipping cost because no rate applies to their case.",
 stem:"What is the most accurate diagnosis of the root cause here?",
 opts:["A syntax error in the shipping calculation code", "An incomplete requirements analysis that failed to account for international addresses as a valid input case", "The compiler failed to catch the bug", "The variable names used in the code were too short"],
 ans:1,
 rationale:"<strong>B is correct.</strong> The defect traces back to requirements analysis that did not anticipate or specify behavior for international addresses, not to a coding syntax issue — the code likely did exactly what the (incomplete) requirements described.",
 misconception:"Students often assume all defects are code-level bugs, overlooking that many real-world defects originate from incomplete or unclear requirements gathered before any code was written."},

{sec:'sim',comp:'mixed',topic:'Time complexity impacting a scaling decision',diff:'adv',type:'sim',
 scenario:"A startup's app currently has 500 users and uses an O(n^2) algorithm to find duplicate entries in a user's contact list, which works fine. As the company plans to scale to 5 million users' contact lists, an engineer raises a concern in a design review.",
 stem:"What is the engineer most likely concerned about?",
 opts:["That the app will look visually different at scale", "That an O(n^2) algorithm's runtime grows dramatically faster than input size, which could become a serious performance bottleneck as contact list sizes grow", "That O(n^2) algorithms cannot be written in most languages", "That the algorithm will produce incorrect results at higher input sizes"],
 ans:1,
 rationale:"<strong>B is correct.</strong> An O(n^2) algorithm's runtime grows quadratically with input size, so what performs acceptably on small contact lists can become a severe performance bottleneck as list sizes grow substantially, which is precisely the scaling concern being raised.",
 misconception:"Students sometimes assume time complexity only affects whether an algorithm gets the right answer, not how practically usable it remains as input size grows."},

{sec:'sim',comp:'mixed',topic:'Constant vs variable in configuration code',diff:'adv',type:'sim',
 scenario:"A developer is writing a tax calculation script for a specific U.S. state where the sales tax rate (7.25%) is fixed by law and does not change during a single run of the program, though it could theoretically change in future tax years.",
 stem:"Which approach best balances the current requirement with realistic future maintenance?",
 opts:["Hard-code 0.0725 directly into every calculation throughout the script with no named reference", "Declare it as a named constant, such as TAX_RATE = 0.0725, used throughout the script, so future rate changes only require updating one line", "Declare it as a variable that the user re-enters every time the program runs", "Store it as a string, since it will be displayed to the user"],
 ans:1,
 rationale:"<strong>B is correct.</strong> A named constant fixes the value for the current tax year (satisfying that it should not change during execution) while keeping the value centralized in one place, making a future legal rate change a single, low-risk update rather than a scattered find-and-replace.",
 misconception:"Students sometimes conflate 'might change someday' with 'should be an ordinary variable,' missing that a constant can still be updated in source code between versions — it simply should not change during a single execution."},

{sec:'sim',comp:'mixed',topic:'Diagnosing a logic error from user reports',diff:'adv',type:'sim',
 scenario:"A weather app's temperature classifier is supposed to label any reading of 32°F or below as 'Freezing.' Users report that a reading of exactly 32°F is being labeled 'Cold' instead.",
 stem:"Given the snippet below, what is the most likely cause of the reported behavior?",
 code:true,
 stemCode:"integer temp\ntemp = 32\nif temp < 32\n   Put \"Freezing\" to output\nelse\n   Put \"Cold\" to output",
 opts:["The variable temp was never declared", "The condition uses strict less-than (temp < 32) instead of less-than-or-equal (temp <= 32), so exactly 32 falls into the else branch", "The else branch should be removed entirely", "There is no bug; this is the intended behavior"],
 ans:1,
 rationale:"<strong>B is correct.</strong> Because the condition is temp < 32, a reading of exactly 32 does not satisfy it and falls through to the else branch labeled 'Cold' — matching the reported bug exactly. Using temp <= 32 would correctly include the boundary value.",
 misconception:"Students sometimes assume boundary bugs like this must involve the wrong variable or a missing declaration, rather than checking whether a comparison operator excludes a boundary value it should include."},

{sec:'sim',comp:'mixed',topic:'Choosing pseudocode abstraction level',diff:'adv',type:'sim',
 scenario:"A senior developer reviewing a junior developer's pseudocode for a new feature finds it written in exact Python syntax, complete with colons, indentation-sensitive blocks, and Python-specific function names like `len()` and `.append()`.",
 stem:"What is the most likely concern the senior developer would raise about this pseudocode?",
 opts:["Pseudocode should not use any variables at all", "Writing pseudocode in exact target-language syntax defeats its purpose as a language-independent planning tool, and ties the design prematurely to one implementation language", "Python cannot be used for pseudocode under any circumstances", "There is no concern; this is the correct way to write pseudocode"],
 ans:1,
 rationale:"<strong>B is correct.</strong> Pseudocode is meant to describe logic independent of any specific language's syntax; writing it in exact Python syntax removes that flexibility and ties early design decisions to one implementation before they need to be.",
 misconception:"Students sometimes think 'more precise syntax' is always better for pseudocode, missing that its value comes specifically from being readable and language-independent during the planning phase."},

{sec:'sim',comp:'mixed',topic:'Algorithm correctness under an edge case',diff:'adv',type:'sim',
 scenario:"A grading script is designed to find the lowest score in a class to potentially drop it. A teaching assistant tests it on a roster of 25 students and it works perfectly every time. Before deploying it school-wide, another TA asks what happens if a class has exactly one student.",
 stem:"Why is this a reasonable and important question to ask before deployment, even though 25 passing tests suggest the function works?",
 opts:["It is not reasonable; 25 passing tests are sufficient proof the function is correct for all cases", "Passing many typical-sized tests does not guarantee correctness for edge cases like a single-element list, which behaves differently and should be explicitly checked", "A class can never have exactly one student, so the question is irrelevant", "The function's time complexity would change with only one student"],
 ans:1,
 rationale:"<strong>B is correct.</strong> Passing tests on typical-sized inputs builds confidence but does not prove correctness for edge cases; a single-element list is a classic edge case where off-by-one or initialization bugs often surface, so it is a reasonable and important case to explicitly verify.",
 misconception:"Students sometimes treat a good track record of passing tests as equivalent to proof of correctness, without separately considering whether edge cases were among those tests."},

{sec:'sim',comp:'mixed',topic:'Heuristic tradeoff in a scheduling tool',diff:'adv',type:'sim',
 scenario:"A university's course scheduling tool uses a heuristic that assigns each student to the first available time slot that doesn't conflict with their existing classes, rather than computing the mathematically optimal schedule across all students simultaneously, which would take far too long to compute for 40,000 students.",
 stem:"What tradeoff does this design decision represent?",
 opts:["The heuristic guarantees the best possible schedule for every student with no downside", "The heuristic produces a reasonably good schedule quickly, at the cost of not guaranteeing the mathematically optimal assignment for every student", "There is no tradeoff since heuristics and optimal algorithms always produce identical results", "The heuristic is slower than computing the fully optimal solution"],
 ans:1,
 rationale:"<strong>B is correct.</strong> Choosing a fast 'first available slot' heuristic over an exhaustive optimal computation trades away a guarantee of the best possible outcome in exchange for a solution that can actually be computed in reasonable time for 40,000 students.",
 misconception:"Students sometimes assume any algorithm that produces a working result must be optimal, missing that heuristics are explicitly chosen when computing the true optimum isn't practical."},

{sec:'sim',comp:'mixed',topic:'Data type bug in a real form',diff:'adv',type:'sim',
 scenario:"An online order form asks users to enter a promo code. A developer declares the promo code variable as an integer, reasoning that most promo codes at the company are numeric, like 2024. During testing, a code like 'SAVE10' causes the program to crash.",
 stem:"What is the most defensible fix, and why?",
 opts:["Keep the integer type, since most codes are numeric", "Change the promo code variable to a string type, since promo codes may contain letters and are never used in arithmetic, regardless of how many happen to look numeric", "Remove the promo code feature entirely", "Change the variable to a boolean type"],
 ans:1,
 rationale:"<strong>B is correct.</strong> Because promo codes can legitimately contain letters and are never used in calculations, a string type correctly accommodates all valid codes, including numeric-looking ones like '2024', without risking a crash on alphanumeric input.",
 misconception:"Students sometimes choose a data type based on what most sample data looks like rather than what the full range of valid input actually requires."},

{sec:'sim',comp:'mixed',topic:'Comparing search costs in a real pipeline',diff:'adv',type:'sim',
 scenario:"A data pipeline processes a batch of 10,000 unsorted transaction IDs once per day and needs to check whether each of 200 flagged IDs appears anywhere in that day's batch. Sorting the 10,000 IDs would take noticeable time, but so would running 200 separate linear searches.",
 stem:"Which analysis most accurately compares the two approaches?",
 opts:["Linear search 200 times is always better regardless of context", "Sorting once (a one-time cost) followed by 200 binary searches is likely more efficient overall than 200 separate linear searches through unsorted data, since the sorting cost is paid once and amortized across all 200 lookups", "Sorting the data has no effect on search performance", "Binary search cannot be used on transaction ID data"],
 ans:1,
 rationale:"<strong>B is correct.</strong> Because the sorted list can be reused across all 200 lookups, the one-time sorting cost is amortized over many binary searches, which is typically more efficient overall than performing 200 independent full linear scans through unsorted data.",
 misconception:"Students sometimes evaluate sorting cost against a single search only, without accounting for how that one-time cost is spread across many repeated lookups in the same batch."},

{sec:'sim',comp:'mixed',topic:'IDE tooling saving debugging time',diff:'adv',type:'sim',
 scenario:"A developer switches from writing code in a plain text editor to using a full IDE partway through a project. On their next bug, the IDE's debugger lets them step through the code line by line and inspect variable values at each step, which quickly reveals a variable was never updated inside a loop.",
 stem:"What does this scenario best illustrate about the value of an IDE's integrated tooling?",
 opts:["IDEs guarantee code has no bugs at all", "Integrated tools like a step-through debugger can make it faster to locate the exact point where program logic diverges from expected behavior, compared to reading code without such tooling", "Plain text editors are always faster for debugging", "The bug would not exist if written in a plain text editor"],
 ans:1,
 rationale:"<strong>B is correct.</strong> The scenario shows the debugger directly revealing where a variable failed to update, illustrating how integrated tooling can substantially speed up locating a bug compared to manually tracing code by eye.",
 misconception:"Students sometimes think of an IDE as merely a nicer-looking editor, missing that its integrated debugging tools materially change how quickly certain classes of bugs can be found."},

{sec:'sim',comp:'mixed',topic:'Recursion vs iteration tradeoff',diff:'adv',type:'sim',
 scenario:"A developer needs to sum the numbers from 1 to n, where n could be very large (potentially in the millions). A colleague suggests a recursive solution, but the developer is concerned about the earlier stack overflow issue they experienced with deep recursion on a different feature.",
 stem:"Given this concern, which approach is most defensible for this specific case?",
 opts:["Always prefer recursion regardless of input size, since it is more elegant", "An iterative loop-based solution, since it avoids the call-stack depth risk that deep recursion carries for very large values of n", "Neither recursion nor iteration can sum a large range of numbers", "Recursion is required by definition for any summation task"],
 ans:1,
 rationale:"<strong>B is correct.</strong> Because very large n could produce extremely deep recursion and risk a stack overflow, an iterative loop-based approach avoids that risk entirely while accomplishing the same summation task.",
 misconception:"Students sometimes treat recursion as inherently superior to iteration for any repetitive task, without weighing practical constraints like call-stack depth for large inputs."},

{sec:'sim',comp:'mixed',topic:'Flowchart miscommunication on a team',diff:'adv',type:'sim',
 scenario:"A business analyst hands a developer a flowchart for a discount calculation. The flowchart's decision diamond is labeled only 'Check discount?' with two unlabeled branches leading out of it, and the developer is unsure which branch represents 'yes' and which represents 'no.'",
 stem:"What is the most accurate description of the problem with this flowchart?",
 opts:["Diamonds should never be used for decisions", "The decision branches are ambiguous because they are not labeled, violating the goal of clearly communicating which path corresponds to which outcome of the condition", "Flowcharts cannot represent discount logic", "The flowchart has too many shapes"],
 ans:1,
 rationale:"<strong>B is correct.</strong> A decision diamond's branches must be clearly labeled (such as Yes/No) so the flowchart unambiguously communicates which path to follow for each outcome; unlabeled branches force the reader to guess.",
 misconception:"Students sometimes focus on whether the correct shape (diamond) was used rather than whether the information on and around that shape is actually complete and unambiguous."},

{sec:'sim',comp:'mixed',topic:'Testing before deployment: search edge case',diff:'adv',type:'sim',
 scenario:"Before deploying a new feature, a QA engineer tests a binary search function on several sorted lists and it passes every time. Before sign-off, a second engineer asks what happens if the function is run on an empty list.",
 stem:"Why is this follow-up question worth asking even though all prior tests passed?",
 opts:["It is not worth asking, since an empty list is not a realistic input", "An empty list is a common edge case that can reveal bugs in boundary handling (like initial low/high index calculations) that typical-sized test lists would never expose", "Binary search cannot be implemented for any list, empty or not", "Passing tests on sorted lists already proves the empty list case works too"],
 ans:1,
 rationale:"<strong>B is correct.</strong> An empty list is a classic edge case for search and sort algorithms, since initial index calculations (like a starting high or low boundary) can behave unexpectedly when there are zero elements — something typical mid-sized test lists would never surface.",
 misconception:"Students sometimes assume that because 'normal' inputs pass, boundary or degenerate inputs like an empty list are automatically safe too, rather than treating them as distinct cases worth explicit verification."},
]

};

/* ============================================================
   ENGINE — generic across all section types, reusable for
   c2, c3, ch1, ch2, ch3, sim once those phases are built.
   ============================================================ */

const STATE = {};   // STATE[sec][i] = true|false|undefined
const SELS  = {};   // SELS[sec][i]  = selected option index
let currentSection = 'c1';
let currentIndex = 0;

SECTIONS.forEach(s => { STATE[s.key] = []; SELS[s.key] = []; });

const compPillClass = { C1:'pill-c1', C2:'pill-c2', C3:'pill-c3', mixed:'pill-mixed' };
const diffLabel = { found:'Foundational', inter:'Intermediate', adv:'Advanced' };

function escapeHtml(str){
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function buildNav(){
  const nav = document.getElementById('navToggle');
  nav.innerHTML = '';
  SECTIONS.forEach(s => {
    const has = QUESTIONS[s.key] && QUESTIONS[s.key].length > 0;
    const btn = document.createElement('button');
    btn.className = 'nav-btn' + (s.key === currentSection ? ' active' : '');
    btn.textContent = s.label + (has ? ` (${QUESTIONS[s.key].length})` : ' — coming soon');
    if(!has){ btn.disabled = true; }
    btn.onclick = () => switchSection(s.key);
    nav.appendChild(btn);
  });
}

function switchSection(key){
  if(!QUESTIONS[key] || QUESTIONS[key].length === 0) return;
  currentSection = key;
  currentIndex = 0;
  buildNav();
  renderSummary();
  renderTabRow();
  renderQuestion();
  renderBreakdown();
}

function renderSummary(){
  const grid = document.getElementById('summaryGrid');
  grid.innerHTML = '';
  SECTIONS.forEach(s => {
    const data = QUESTIONS[s.key] || [];
    if(data.length === 0) return;
    const answered = STATE[s.key].filter(v => v !== undefined).length;
    const correct = STATE[s.key].filter(v => v === true).length;
    const pct = answered ? Math.round((correct/answered)*100) : null;
    const div = document.createElement('div');
    let cls = 'neutral';
    if(pct !== null) cls = pct >= 80 ? 'pass' : 'fail';
    div.className = 'summary-card ' + cls;
    div.innerHTML = `<div class="t">${s.label}</div><div class="p">${pct === null ? '—' : pct+'%'}</div><div style="font-size:11px;color:var(--label-dark);">${answered}/${data.length} answered</div>`;
    div.onclick = () => switchSection(s.key);
    grid.appendChild(div);
  });
}

function renderTabRow(){
  const row = document.getElementById('tabRow');
  row.innerHTML = '';
  const data = QUESTIONS[currentSection];
  data.forEach((q,i) => {
    const t = document.createElement('div');
    let cls = 'tab';
    const st = STATE[currentSection][i];
    if(st === true) cls += ' correct';
    else if(st === false) cls += ' wrong';
    if(i === currentIndex) cls += ' current';
    t.className = cls;
    t.textContent = i+1;
    t.onclick = () => { currentIndex = i; renderTabRow(); renderQuestion(); };
    row.appendChild(t);
  });
}

function renderQuestion(){
  const data = QUESTIONS[currentSection];
  const q = data[currentIndex];
  const card = document.getElementById('questionCard');
  const sel = SELS[currentSection][currentIndex];
  const locked = sel !== undefined;

  let html = `<div class="qhead">
    <span class="pill ${compPillClass[q.comp]}">${q.comp}</span>
    <span class="pill pill-diff">${diffLabel[q.diff]}</span>
    <span class="pill pill-diff">${q.topic}</span>
    <span class="qcounter">Question ${currentIndex+1} of ${data.length}</span>
  </div>`;

  if(q.scenario){
    html += `<div class="scenario"><strong>Scenario:</strong> ${q.scenario}</div>`;
  }

  html += `<div class="stem">${q.stem}</div>`;

  if(q.code && q.stemCode){
    html += `<pre class="code">${escapeHtml(q.stemCode)}</pre>`;
  }

  html += `<div class="opts">`;
  q.opts.forEach((opt,i) => {
    let cls = 'opt';
    if(locked){
      cls += ' locked';
      if(i === q.ans) cls += ' reveal-correct';
      else if(i === sel) cls += ' selected-wrong';
    }
    html += `<div class="${cls}" data-i="${i}">${String.fromCharCode(97+i)}. ${opt}</div>`;
  });
  html += `</div>`;

  if(locked){
    html += `<div class="feedback">
      <div class="rationale">${q.rationale}</div>
      <div class="misc">Instructor note: ${q.misconception}</div>
    </div>`;
  }

  html += `<div class="navbtns">
    <button id="prevBtn">← Previous</button>
    <button id="nextBtn">Next →</button>
  </div>`;

  card.innerHTML = html;

  card.querySelectorAll('.opt').forEach(el => {
    el.addEventListener('click', () => {
      if(SELS[currentSection][currentIndex] !== undefined) return;
      const i = parseInt(el.dataset.i);
      SELS[currentSection][currentIndex] = i;
      STATE[currentSection][currentIndex] = (i === q.ans);
      renderQuestion();
      renderTabRow();
      updateScoreboard();
      renderSummary();
      renderBreakdown();
    });
  });

  document.getElementById('prevBtn').onclick = () => go(-1);
  document.getElementById('nextBtn').onclick = () => go(1);
}

function go(dir){
  const data = QUESTIONS[currentSection];
  const next = currentIndex + dir;
  if(next < 0 || next >= data.length) return;
  currentIndex = next;
  renderTabRow();
  renderQuestion();
}

function updateScoreboard(){
  let answered=0, correct=0, wrong=0, total=0;
  SECTIONS.forEach(s => {
    const data = QUESTIONS[s.key] || [];
    total += data.length;
    STATE[s.key].forEach(v => {
      if(v !== undefined){ answered++; if(v) correct++; else wrong++; }
    });
  });
  const pct = answered ? Math.round((correct/answered)*100) : 0;
  document.getElementById('statAnswered').textContent = answered;
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('statPct').textContent = pct + '%';
  const statusEl = document.getElementById('statStatus');
  if(answered === 0){ statusEl.textContent = '—'; statusEl.style.color=''; }
  else if(pct >= 80){ statusEl.textContent = 'PASS'; statusEl.style.color = 'var(--green)'; }
  else { statusEl.textContent = 'FAIL'; statusEl.style.color = 'var(--red)'; }
  document.getElementById('progressFill').style.width = total ? (answered/total*100)+'%' : '0%';
}

function renderBreakdown(){
  const el = document.getElementById('breakdown');
  el.innerHTML = '';
  const data = QUESTIONS[currentSection];
  const byComp = {};
  data.forEach((q,i) => {
    const key = q.topic;
    if(!byComp[key]) byComp[key] = {correct:0, answered:0};
    const st = STATE[currentSection][i];
    if(st !== undefined){ byComp[key].answered++; if(st) byComp[key].correct++; }
  });
  const colorFor = (pct) => pct === null ? 'var(--label)' : pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--amber)' : 'var(--red)';
  Object.keys(byComp).forEach(topic => {
    const b = byComp[topic];
    const pct = b.answered ? Math.round((b.correct/b.answered)*100) : null;
    const row = document.createElement('div');
    row.className = 'breakdown-row';
    row.innerHTML = `<div class="breakdown-label">${topic}</div>
      <div class="breakdown-track"><div class="breakdown-fill" style="width:${pct||0}%;background:${colorFor(pct)}"></div></div>
      <div class="breakdown-pct">${pct===null?'—':pct+'%'}</div>`;
    el.appendChild(row);
  });
}

// init
buildNav();
renderSummary();
renderTabRow();
renderQuestion();
updateScoreboard();
renderBreakdown();
</script>
</body>
</html>
